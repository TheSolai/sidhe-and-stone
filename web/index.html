<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d6d4c8" />
    <!--
      An inline SVG favicon: a gold crown on dark ink. Inline means the
      browser never issues a request for /favicon.ico, so the page makes
      no failed network calls at all.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231e1a16'/%3E%3Cpath d='M2 12 L3 4 L6 8 L8 3 L10 8 L13 4 L14 12 Z' fill='%23e5b63d'/%3E%3Crect x='2' y='13' width='12' height='2' fill='%23b98053'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Sidhe &amp; Stone — a cozy management sim about excavating Irish fairy mounds, cataloguing what you find, and deciding what the public gets to see."
    />
    <title>Sidhe &amp; Stone</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1e1a16;
        --paper: #e8dcc5;
        --ground: #d6d4c8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #d6d4c8;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        /* The page shell is flat palette colour on purpose.
           A radial-gradient interpolates between two colours, so every
           pixel between them is OFF-palette -- and the page shell is the
           largest thing in the frame. A hard-edged dither would need a
           repeating checkerboard, which fights the letterbox shape, so
           the shell stays flat: X behind, and a W card behind the game.
           The warmth comes from the game itself, which is all art. */
        background: #d6d4c8;
      }

      #stage {
        position: relative;
        display: block;
        line-height: 0;
      }

      canvas {
        display: block;
        /* Nearest-neighbour for the final upscale: pixel art must stay crisp
           and even, and a smooth scale makes it look like a JPEG. */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        cursor: pointer;
        /* A HARD offset shadow, not a blurred one.
           `filter: drop-shadow(0 8px 24px ...)` blurs, and a blur
           interpolates every pixel into a colour that is not in the
           palette. A solid offset copy of the canvas silhouette is
           made of exact palette pixels instead, and it is more
           KairoSoft anyway: hard shadows, no softness. */
        box-shadow: 8px 8px 0 #716855;
      }

      /* Screen-reader-only live region: the canvas is opaque to assistive
         technology, so every meaningful state change is announced here. */
      #announcer {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #d6d4c8;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        line-height: 1.6;
        text-align: center;
      }

      #boot.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="960" height="540" aria-label="Sidhe and Stone game"></canvas>
      <div id="boot">Loading the mounds…</div>
      <div id="announcer" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
